name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: requirements-frozen.txt

      - name: Install frozen requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-frozen.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run strict test suite
        run: python -m pytest -q --strict-config --strict-markers

      - name: Verify public Stage 1 evidence
        run: python -m src.stage1_public_verify

      - name: Confirm verification is non-mutating
        run: git diff --exit-code
